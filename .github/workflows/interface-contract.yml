name: Interface contract

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Note API contract and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      TESTING: '1'
      SECRET_KEY: lab4-test-secret-not-for-production
      DATABASE_URL: sqlite:///./data/lab4-bootstrap.db
      FILE_STORAGE_PROVIDER: local
      STORAGE_PUBLIC_BASE_URL: http://testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r ../requirements.txt flake8==7.2.0
      - name: Check Python errors
        run: python -m flake8 app test/test_interface_contract.py --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test note API contract
        run: python -m pytest test/test_interface_contract.py -v --junitxml=contract-results.xml
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-contract-results
          path: backend/contract-results.xml
          if-no-files-found: warn
