# Overlay for the main Compose file; enables S3 for the backend.
# docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.minio.yml --profile s3 up -d --build --wait
services:
  backend:
    environment:
      FILE_STORAGE_PROVIDER: s3
    depends_on:
      minio-init:
        condition: service_completed_successfully
